app:
  packages: 'all' # ✨

  pluginOverrides:
    - match:
        pluginId: pages
      info:
        description: 'This description was overridden in packages/app/app-config.yaml'
    - match:
        pluginId: /^catalog(-.*)?$/
      info:
        ownerEntityRefs: [cubic-belugas]
    - match:
        packageName: '@backstage/plugin-scaffolder'
      info:
        ownerEntityRefs: [cubic-belugas]

  extensions:
    # CP9 QA fix — Issue #6 (CRITICAL) / Issue #8:
    #
    # The home page extension is fully DISABLED in the Blitzy Sandbox per
    # AAP §0.5.1.4. The dashboard has been removed and the bare URL `/`
    # is handled by `rootRedirectModule` in `packages/app/src/App.tsx`
    # which mounts a `<Navigate to="/catalog" replace />` redirect at
    # path `/`. Previously this `page:home` block overrode the home plugin's
    # default path from `/home` to `/`, causing the home plugin's
    # empty-widget-customizer page to take precedence over the redirect
    # module (auto-discovered via `app.packages: all`). Setting the
    # extension to `false` disables it so `rootRedirectModule` becomes
    # the sole owner of `/` and the user lands on `/catalog`.
    - page:home: false

    # CP9 QA fix — Issue #8:
    #
    # Register the `api:app/app-language` extension here with the
    # authoritative locale list `['en', 'fr', 'ko', 'zh-Hans']` that
    # matches the four README locale variants per AAP §0.6.1.7.
    #
    # CRITICAL: Backstage config arrays do NOT merge across config
    # files — they REPLACE. Since this package-level config defines its
    # own `app.extensions` array (page:home: false, entity-card overrides,
    # nav-item filters, etc.), any extension defined in the root
    # `app-config.yaml`'s `app.extensions` is entirely shadowed. The root
    # config's `api:app/app-language` block IS present but is never
    # applied at runtime because this file's `app.extensions` array
    # supersedes it. The previous CP9 fix dropped the override but did
    # not re-add the entry here, causing the AppLanguageSelector to fall
    # back to `[DEFAULT_LANGUAGE]` (just `['en']`), which made
    # `UserSettingsLanguageToggle` return null since
    # `languages.length <= 1` (see
    # plugins/user-settings/src/components/General/UserSettingsLanguageToggle.tsx
    # L43-L45). Re-adding the entry here restores the Language combobox
    # in Settings with the correct locale options.
    - api:app/app-language:
        config:
          availableLanguages: ['en', 'fr', 'ko', 'zh-Hans']
          defaultLanguage: 'en'

    - entity-card:org/members-list:
        config:
          showAggregateMembersToggle: true
          initialRelationAggregation: aggregated
    - entity-card:org/ownership:
        config:
          ownedKinds: ['Component', 'API', 'System']

    # - apis.plugin.graphiql.browse.gitlab: true
    # - graphiql-endpoint:graphiql/gitlab: true

    - nav-item:search: false
    - nav-item:user-settings: false
    - nav-item:catalog
    - nav-item:scaffolder: false

    # Pages
    - page:catalog/entity:
        config:
          showNavItemIcons: true
          groups:
            - overview:
                title: Overview
            - documentation:
                title: Documentation
                icon: docs

    # Entity page cards — maximize information density
    - entity-card:catalog-graph/relations:
        config:
          height: 400
    - entity-card:catalog/about:
        config:
          type: info
    - entity-card:catalog/labels:
        config:
          type: info
    - entity-card:catalog/links:
        config:
          filter:
            kind: component
            metadata.links:
              $exists: true
          type: info
    - entity-card:catalog/readme
    # Org Plugin
    - entity-card:org/group-profile
    - entity-card:org/members-list
    - entity-card:org/ownership
    - entity-card:org/user-profile:
        config:
          maxRelations: 5
          hideIcons: true
    # Disable empty/irrelevant cards
    - entity-card:api-docs/has-apis: false
    - entity-card:api-docs/consumed-apis: false
    - entity-card:api-docs/provided-apis: false
    - entity-card:api-docs/providing-components: false
    - entity-card:api-docs/consuming-components: false
    - entity-card:catalog/has-components: false
    - entity-card:catalog/has-resources: false
    - entity-card:catalog/has-subcomponents: false

    # Entity page contents
    - entity-content:catalog/overview:
        config:
          group: overview
    - entity-content:techdocs:
        config:
          group: documentation
          icon: techdocs
    # Disable API and Kubernetes content tabs
    - entity-content:api-docs/definition: false
    - entity-content:api-docs/apis: false
    - entity-content:kubernetes/kubernetes: false

    # Disable irrelevant nav items
    - nav-item:app-visualizer: false
    - nav-item:api-docs: false
    - nav-item:devtools: false
    - nav-item:catalog-unprocessed-entities: false

